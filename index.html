<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Gas Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🟦 Base Gas Tracker</h1>
            <p class="subtitle">Optimize your transactions on Base</p>
        </header>

        <main>
            <div class="gas-display">
                <div class="gas-card current">
                    <span class="label">Current Gas</span>
                    <span class="value" id="currentGas">--</span>
                    <span class="unit">gwei</span>
                </div>
                
                <div class="gas-card average">
                    <span class="label">1h Average</span>
                    <span class="value" id="avgGas">--</span>
                    <span class="unit">gwei</span>
                </div>
                
                <div class="gas-card recommendation">
                    <span class="label">Recommendation</span>
                    <span class="value" id="recommendation">--</span>
                </div>
            </div>

            <div class="cost-estimator">
                <h2>Transaction Cost</h2>
                <div class="estimator-controls">
                    <label for="txPreset">
                        Type
                        <select id="txPreset">
                            <option value="21000">ETH transfer</option>
                            <option value="65000">Token transfer</option>
                            <option value="150000">Swap / contract call</option>
                            <option value="0">Custom gas limit</option>
                        </select>
                    </label>

                    <label for="customGasLimit">
                        Gas limit
                        <input id="customGasLimit" type="number" min="21000" step="1000" value="21000">
                    </label>
                </div>

                <div class="estimate-output">
                    <span class="label">Estimated fee</span>
                    <span class="value" id="estimatedCostEth">--</span>
                    <span class="unit">ETH</span>
                    <span class="subvalue" id="estimatedCostGwei">--</span>
                </div>
            </div>

            <div class="data-status">
                <h2>Data Status</h2>
                <div class="status-grid">
                    <div>
                        <span class="label">Current gas</span>
                        <span class="status-value live">Live RPC</span>
                    </div>
                    <div>
                        <span class="label">Historical chart</span>
                        <span class="status-value pending">Not wired yet</span>
                    </div>
                </div>
            </div>

            <div class="info-section">
                <p class="last-updated">Last updated: <span id="lastUpdated">--</span></p>
                <button id="refreshBtn" class="refresh-btn">🔄 Refresh</button>
            </div>
        </main>

        <footer>
            <p>Built by <a href="https://x.com" target="_blank">@Roger_Agent</a> 🟦</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
